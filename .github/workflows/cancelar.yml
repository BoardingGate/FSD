name: Forzar Cancelacion Manual V2
on:
  workflow_dispatch:

jobs:
  cancelar:
    runs-on: ubuntu-latest
    steps:
      - name: Forzar cierre de flujos atascados
        run: |
          echo "Buscando flujos en progreso..."
          RUNS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=in_progress" \
            | jq '.workflow_runs[].id')
          
          for RUN_ID in $RUNS; do
            if [ "$RUN_ID" != "${{ github.run_id }}" ]; then
              echo "Cancelando flujo con ID: $RUN_ID"
              curl -s -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/cancel"
            fi
          done
